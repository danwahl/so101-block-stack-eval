[project]
name = "so101-block-stack-eval"
version = "0.1.0"
description = "The SO-101 block stack in ManiSkill, as an Inspect Robots embodiment and task."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "inspect-robots>=0.58",
    "inspect-robots-agent>=0.28",
    "mani-skill==3.0.1",
    "sapien==3.0.3",
    "torch",
    "numpy>=2.0,<2.3",
    "gymnasium>=1.0,<2",
]

[project.optional-dependencies]
# The VLA checkpoints run through the SO-ARM plugin's `lerobot` policy, on the lerobot
# commit they were trained and scored with.
vla = ["inspect-robots-so101[lerobot]", "lerobot[smolvla,vla_jepa,lawam]"]

[tool.uv]
# The model stack the VLA checkpoints were trained with, so a score moves only with the
# harness. Inert unless the vla extra is installed.
constraint-dependencies = ["transformers==5.5.4", "peft==0.20.0", "accelerate==1.14.0"]

[tool.uv.sources]
# The agent plugin's custom tools (`LLMAgentPolicy(tools=...)`) are unreleased, so it comes
# from the fork's agent-custom-tools branch, which only gains commits; uv.lock records the
# commit. That branch also supplies inspect-robots itself: the plugin names core as a
# workspace source, so both track the fork's pre-release main.
inspect-robots-agent = { git = "https://github.com/danwahl/inspect-robots", subdirectory = "plugins/inspect-robots-agent", branch = "agent-custom-tools" }
# Loads LoRA checkpoints and their camera renaming; unreleased.
inspect-robots-so101 = { git = "https://github.com/danwahl/inspect-robots-so101", branch = "vla-checkpoints" }
# LaWAM landed after lerobot 0.6.1, so the VLAs pin the commit they were trained on.
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "f5c9bc02137c331b009eccd44ece6f11b62187a8" }
evalib = { git = "https://github.com/danwahl/evalib", tag = "v0.2.2" }

# Installed so Inspect Robots finds these by name without importing them first.
[project.entry-points."inspect_robots.embodiments"]
so101_sim = "so101_block_stack_eval.embodiment:SimEmbodiment"

[project.entry-points."inspect_robots.tasks"]
so101-block-stack = "so101_block_stack_eval.task:stack"

[dependency-groups]
dev = [
    "evalib",
    "httpx",
    "pandas",
    "pyarrow",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_block_stack_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]
